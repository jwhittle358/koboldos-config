# KoboldOS greetd config — installed to /etc/greetd/config.toml by install.sh.
# ReGreet runs inside cage (a kiosk compositor) and lists the sessions in
# /usr/share/wayland-sessions, so Sway shows up automatically.

[terminal]
vt = 1

[default_session]
command = "cage -s -- regreet"
user = "greeter"
